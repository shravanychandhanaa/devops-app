name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v3

      # 🔐 Login to Docker Hub
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 🏷️ Create image tag (use commit SHA)
      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      # 🐳 Build & Push Backend
      - name: Build Backend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/backend:$IMAGE_TAG ./backend

      - name: Push Backend
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/backend:$IMAGE_TAG

      # 🐳 Build & Push Frontend
      - name: Build Frontend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend:$IMAGE_TAG ./frontend

      - name: Push Frontend
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/frontend:$IMAGE_TAG

      # 📦 Clone Helm Repo (PRIVATE)
      - name: Clone Helm Repo
        run: |
          git clone https://x-access-token:${{ secrets.HELM_REPO_TOKEN }}@github.com/shravanychandhanaa/devops-helm.git

      # ✏️ Update values.yaml
      - name: Update Helm values
        run: |
          cd devops-helm/myapp
          sed -i "s/tag: .*/tag: \"$IMAGE_TAG\"/g" values.yaml

      # 📤 Commit & Push changes
      - name: Push changes to Helm repo
        run: |
          cd devops-helm
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Update image tag to $IMAGE_TAG"
          git push